@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#1b1f4b;--b2:#2c1f55;--b3:#0f3b4f;--fg:#fff;--hid:rgba(255,255,255,.1);--wheel:rgba(255,255,255,.12);--pill:rgba(255,255,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--b1:#1b1f4b;--b2:#2c1f55;--b3:#0f3b4f;--fg:#fff;--hid:rgba(255,255,255,.1);--wheel:rgba(255,255,255,.12);--pill:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100%;background:linear-gradient(160deg,var(--b1),var(--b2) 55%,var(--b3));color:var(--fg);font-family:"Fredoka",ui-rounded,system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
button{font:inherit;color:inherit;border:0;background:var(--pill);border-radius:999px;padding:8px 14px;font-weight:700;backdrop-filter:blur(6px)}
#lang b{opacity:.45}#lang b.a{opacity:1}
#lv{font-size:22px;font-weight:700;letter-spacing:1px}
#hint{position:relative}
#hint i{position:absolute;top:-6px;right:-4px;background:var(--gold);color:#3b2a55;border-radius:999px;font-style:normal;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center}
#bw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{display:grid;gap:4px}
.cell{width:var(--s);height:var(--s);border-radius:22%;background:var(--hid);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s)*.58);color:var(--tfg)}
.cell.on,.cell.hint{background:var(--tile);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.cell.hint{background:var(--gold)}
.pop{animation:pop .4s both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
#cur{align-self:center;min-width:56px;height:42px;line-height:42px;padding:0 18px;border-radius:999px;background:var(--tfg);color:#fff;font-size:24px;font-weight:700;letter-spacing:4px;text-align:center;visibility:hidden}
#cur.show{visibility:visible}#cur.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#msg{height:24px;text-align:center;font-size:15px;font-weight:500;margin:4px 0}
#wrap{display:flex;justify-content:center;padding:0 0 16px}
#circ{position:relative;width:300px;height:300px;border-radius:50%;background:var(--wheel);box-shadow:inset 0 0 0 6px var(--pill),0 8px 24px rgba(0,0,0,.18);touch-action:none}
#lines{position:absolute;inset:0;pointer-events:none}
.l{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--tile);color:var(--tfg);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .12s}
.l.s{background:var(--gold);transform:scale(1.15)}
#shuf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;padding:0;font-size:24px}
#ov{position:fixed;inset:0;background:rgba(20,10,40,.65);display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;color:#fff;font-size:32px;font-weight:700;overflow:hidden}
#ov button{background:var(--gold);color:#3b2a55;font-size:20px;padding:12px 26px}
.cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

const T={es:{lv:"Nivel",done:"¡Nivel completado!",nx:"Siguiente nivel",dup:"Ya la tienes",no:"No está en la lista",ex:"¡Palabra extra!",hint:"+1 pista por 3 extras"},
en:{lv:"Level",done:"Level complete!",nx:"Next level",dup:"Already found",no:"Not in the list",ex:"Bonus word!",hint:"+1 hint per 3 bonus"}};
const $=id=>document.getElementById(id);
const W={};for(const k in D)W[k]=[...new Set(D[k].split(" ").filter(Boolean).map(w=>w.toUpperCase()))];
let S={lang:"es",lv:{es:1,en:1},hints:3,bonus:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("pw2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("pw2",JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function can(w,b){const c={};for(const ch of b)c[ch]=(c[ch]||0)+1;for(const ch of w){if(!c[ch])return false;c[ch]--}return true}

// ---- Crucigrama: d=0 horizontal, d=1 vertical ----
function fits(g,w,x,y,d){
  const dx=d?0:1,dy=d?1:0;let cross=0;
  if(g.has((x-dx)+","+(y-dy))||g.has((x+dx*w.length)+","+(y+dy*w.length)))return -1;
  for(let i=0;i<w.length;i++){
    const cx=x+dx*i,cy=y+dy*i,e=g.get(cx+","+cy);
    if(e){if(e!=w[i])return -1;cross++}
    else if(g.has((cx+dy)+","+(cy+dx))||g.has((cx-dy)+","+(cy-dx)))return -1;
  }
  return cross;
}
const put=(g,p)=>{for(let i=0;i<p.w.length;i++)g.set((p.x+(p.d?0:i))+","+(p.y+(p.d?i:0)),p.w[i])};
function layout(base,pool,N){
  let best=null;
  for(let t=0;t<60;t++){
    const g=new Map(),pl=[{w:base,x:0,y:0,d:0}];put(g,pl[0]);
    for(const w of shuf(pool)){
      if(pl.length>=N)break;
      let c=[],m=0;
      for(const p of pl)for(let i=0;i<p.w.length;i++)for(let j=0;j<w.length;j++){
        if(p.w[i]!=w[j])continue;
        const nd=1-p.d,x=p.d?p.x-j:p.x+i,y=p.d?p.y+i:p.y-j,s=fits(g,w,x,y,nd);
        if(s<1)continue;
        if(s>m){m=s;c=[]}
        if(s==m)c.push({w,x,y,d:nd});
      }
      if(c.length){const p=c[Math.floor(Math.random()*c.length)];pl.push(p);put(g,p)}
    }
    let X=[],Y=[];g.forEach((_,k)=>{const [x,y]=k.split(",").map(Number);X.push(x);Y.push(y)});
    const area=(Math.max(...X)-Math.min(...X)+1)*(Math.max(...Y)-Math.min(...Y)+1);
    const sc=pl.length*100-area;
    if(!best||sc>best.sc)best={sc,pl};
  }
  return best.pl;
}

// ---- Estado del nivel ----
let placed,bonus,gotB,shown,G,cells,letters,pos,sel=[],pt=null;
function newLevel(){
  const lv=S.lv[S.lang],all=W[S.lang],N=Math.min(6+Math.floor(lv/2),14);
  let len=Math.min(6+Math.floor((lv-1)/4),9),res=null;
  for(;len>=4&&!res;len--){
    for(const b of shuf(all.filter(w=>w.length==len)).slice(0,60)){
      const subs=all.filter(w=>w!=b&&w.length>=3&&can(w,b));
      if(subs.length<6)continue;
      const pl=layout(b,subs,N);
      if(pl.length>=5){res={b,subs,pl};break}
    }
  }
  const mx=Math.min(...res.pl.map(p=>p.x)),my=Math.min(...res.pl.map(p=>p.y));
  placed=res.pl.map(p=>({...p,x:p.x-mx,y:p.y-my}));
  const used=new Set(placed.map(p=>p.w));
  bonus=new Set(res.subs.filter(w=>!used.has(w)));
  gotB=new Set();shown=new Set();sel=[];pt=null;
  letters=shuf(res.b.split(""));
  buildBoard();buildWheel();hud();
}
function buildBoard(){
  const bd=$("board");bd.innerHTML="";cells={};G=new Map();let C=0,R=0;
  placed.forEach(p=>{p.k=[...p.w].map((ch,i)=>{const x=p.x+(p.d?0:i),y=p.y+(p.d?i:0);G.set(x+","+y,ch);return x+","+y})});
  G.forEach((_,k)=>{
    const [x,y]=k.split(",").map(Number);C=Math.max(C,x+1);R=Math.max(R,y+1);
    const e=document.createElement("div");e.className="cell";e.style.gridColumn=x+1;e.style.gridRow=y+1;bd.appendChild(e);cells[k]=e;
  });
  bd.dataset.c=C;bd.dataset.r=R;fit();
}
function fit(){
  const w=$("bw").getBoundingClientRect(),b=$("board"),c=+b.dataset.c,r=+b.dataset.r;
  if(!c)return;
  const s=Math.max(18,Math.min(50,Math.floor((w.width-20-4*(c-1))/c),Math.floor((w.height-20-4*(r-1))/r)));
  b.style.setProperty("--s",s+"px");
  b.style.gridTemplateColumns="repeat("+c+",var(--s))";b.style.gridTemplateRows="repeat("+r+",var(--s))";
}
function buildWheel(){
  document.querySelectorAll(".l").forEach(e=>e.remove());
  const n=letters.length,R=112,C=150;
  pos=letters.map((ch,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n,x=C+R*Math.cos(a),y=C+R*Math.sin(a);
    const d=document.createElement("div");d.className="l";d.id="l"+i;d.textContent=ch;d.style.left=x+"px";d.style.top=y+"px";
    $("circ").appendChild(d);return{x,y};
  });
  $("pl").setAttribute("points","");$("cur").className="";
}
function hud(){
  const t=T[S.lang];
  $("lv").textContent=t.lv+" "+S.lv[S.lang];
  $("hint").querySelector("i").textContent=S.hints;
  document.querySelectorAll("#lang b").forEach((b,i)=>b.classList.toggle("a",(i==0)==(S.lang=="es")));
  if(!$("msg").dataset.t)$("msg").textContent="⭐ "+S.bonus;
}
function say(m){
  const e=$("msg");e.dataset.t=1;e.textContent=m;
  setTimeout(()=>{delete e.dataset.t;hud()},1500);
}
function reveal(keys,cls){
  keys.forEach((k,i)=>{
    if(shown.has(k))return;shown.add(k);
    const e=cells[k];e.textContent=G.get(k);e.className="cell "+cls+" pop";e.style.animationDelay=(i*70)+"ms";
  });
}
function check(){
  if(placed.every(p=>p.k.every(k=>shown.has(k)))){S.hints++;save();setTimeout(win,600)}
}
function win(){
  $("ovt").textContent=T[S.lang].done;$("nx").textContent=T[S.lang].nx;$("ov").style.display="flex";
  const cols=["#ffcf4a","#ff6b8b","#6ad4a0","#7aa2ff","#fff"];
  for(let i=0;i<60;i++){
    const c=document.createElement("i");c.className="cf";
    c.style.left=Math.random()*100+"%";c.style.background=cols[i%5];c.style.animationDelay=Math.random()*1.2+"s";
    $("ov").appendChild(c);setTimeout(()=>c.remove(),4000);
  }
  hud();
}

// ---- Entrada: arrastrar por las letras ----
function draw(){
  letters.forEach((_,i)=>$("l"+i).classList.toggle("s",sel.includes(i)));
  $("cur").textContent=sel.map(i=>letters[i]).join("");
  $("cur").classList.toggle("show",sel.length>0);
  $("pl").setAttribute("points",sel.map(i=>pos[i].x+","+pos[i].y).concat(pt&&sel.length?[pt.x+","+pt.y]:[]).join(" "));
}
function xy(e){const r=$("circ").getBoundingClientRect();return{x:(e.clientX-r.left)*300/r.width,y:(e.clientY-r.top)*300/r.height}}
function hit(p){
  pt=p;
  for(let i=0;i<pos.length;i++){
    if(Math.hypot(pos[i].x-p.x,pos[i].y-p.y)>28)continue;
    if(!sel.includes(i))sel.push(i);
    else if(sel.length>1&&sel[sel.length-2]==i)sel.pop();
  }
  draw();
}
function submit(){
  const w=sel.map(i=>letters[i]).join(""),t=T[S.lang],cur=$("cur");
  sel=[];pt=null;draw();
  if(w.length<3){cur.classList.remove("show");return}
  cur.classList.add("show");cur.textContent=w;
  const p=placed.find(p=>p.w==w);
  if(p){
    if(p.k.every(k=>shown.has(k)))say(t.dup);else{reveal(p.k,"on");check()}
  }else if(bonus.has(w)){
    if(gotB.has(w))say(t.dup);
    else{gotB.add(w);S.bonus++;if(S.bonus%3==0){S.hints++;say(t.ex+" 💡+1")}else say(t.ex);save();hud()}
  }else{cur.classList.remove("bad");void cur.offsetWidth;cur.classList.add("bad");say(t.no)}
  setTimeout(()=>{if(!sel.length)cur.classList.remove("show","bad")},900);
}
const c=$("circ");
c.addEventListener("pointerdown",e=>{if(e.target.id=="shuf")return;c.setPointerCapture(e.pointerId);hit(xy(e))});
c.addEventListener("pointermove",e=>{if(e.buttons||sel.length)hit(xy(e))});
c.addEventListener("pointerup",submit);
c.addEventListener("pointercancel",()=>{sel=[];pt=null;draw()});
$("shuf").onclick=()=>{letters=shuf(letters);sel=[];buildWheel()};
$("hint").onclick=()=>{
  if(S.hints<=0)return;
  const hid=[...G.keys()].filter(k=>!shown.has(k));if(!hid.length)return;
  reveal([hid[Math.floor(Math.random()*hid.length)]],"hint");
  S.hints--;save();hud();check();
};
$("lang").onclick=()=>{S.lang=S.lang=="es"?"en":"es";save();document.documentElement.lang=S.lang;newLevel()};
$("nx").onclick=()=>{S.lv[S.lang]++;save();$("ov").style.display="none";newLevel()};
addEventListener("resize",fit);
document.documentElement.lang=S.lang;
newLevel();
</script>
